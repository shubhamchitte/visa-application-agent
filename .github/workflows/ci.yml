name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # no uv on the runner, so the Makefile builds .venv from requirements.lock
      - run: make test
      - run: make demo
