[project]
name = "visa-agent"
version = "0.1.0"
description = "Visa application agent: LLM proposes, code disposes."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.11.7",
    "pyyaml==6.0.2",
    "pymupdf==1.26.3",
    "python-dotenv==1.1.1",
    "google-genai==1.28.0",
    "groq==0.31.0",
]

[project.optional-dependencies]
# RapidOCR for image-only pages (VISA_OCR=auto picks it when installed); full pins in requirements-ocr.txt
ocr = ["rapidocr-onnxruntime==1.4.4", "onnxruntime==1.23.2"]

[dependency-groups]
dev = ["pytest==8.4.1", "reportlab==4.4.3", "faker==37.5.3", "pypdf==6.21.3", "numpy==2.4.6", "pillow==13.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visa_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
